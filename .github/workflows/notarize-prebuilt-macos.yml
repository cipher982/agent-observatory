name: macOS Prebuilt Notarization

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: "0.3.0"

permissions:
  contents: write

jobs:
  notarize-prebuilt:
    name: Notarize prebuilt macOS assets
    runs-on: macos-26
    env:
      VERSION: ${{ inputs.version }}
      DMG_STYLE: headless
      GH_TOKEN: ${{ github.token }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Notary secret preflight
        shell: bash
        run: |
          set -euo pipefail
          for name in MACOS_NOTARY_APPLE_ID MACOS_NOTARY_APP_PASSWORD MACOS_NOTARY_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "missing $name" >&2
              exit 1
            fi
          done

      - name: Install packaging tools
        run: brew install create-dmg imagemagick

      - name: Download draft release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          mkdir -p prebuilt dist
          gh release download "$tag" \
            --dir prebuilt \
            --pattern "Agent-Observatory-${VERSION}-macOS.zip" \
            --pattern "Agent-Observatory-${VERSION}-macOS.dmg" \
            --pattern "agents" \
            --pattern "SHA256SUMS"
          test -s "prebuilt/Agent-Observatory-${VERSION}-macOS.zip"
          test -s "prebuilt/Agent-Observatory-${VERSION}-macOS.dmg"
          test -x "prebuilt/agents"

      - name: Extract and verify signed app
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          ditto -x -k "prebuilt/Agent-Observatory-${VERSION}-macOS.zip" "$work"
          test -d "$work/Agent Observatory.app"
          cp -R "$work/Agent Observatory.app" "dist/Agent Observatory.app"
          cp "prebuilt/agents" "dist/agents"
          codesign --verify --deep --strict "dist/Agent Observatory.app"
          "dist/Agent Observatory.app/Contents/Resources/agents" version | grep -q "agent-observatory ${VERSION}"

      - name: Notarize and staple app
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          ditto -c -k --keepParent "dist/Agent Observatory.app" "$tmp/app-notary.zip"
          xcrun notarytool submit "$tmp/app-notary.zip" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" \
            --wait
          xcrun stapler staple "dist/Agent Observatory.app"
          xcrun stapler validate "dist/Agent Observatory.app"

      - name: Rebuild release archive and DMG
        shell: bash
        run: |
          set -euo pipefail
          zip_name="Agent-Observatory-${VERSION}-macOS.zip"
          dmg_name="Agent-Observatory-${VERSION}-macOS.dmg"
          (cd dist && ditto -c -k --keepParent "Agent Observatory.app" "$zip_name")
          DMG_STYLE="$DMG_STYLE" scripts/make-dmg.sh "dist/Agent Observatory.app" "dist/$dmg_name" "Agent Observatory"

      - name: Notarize and staple DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="dist/Agent-Observatory-${VERSION}-macOS.dmg"
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"

      - name: Verify notarized artifacts
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 "Agent-Observatory-${VERSION}-macOS.dmg" "Agent-Observatory-${VERSION}-macOS.zip" agents > SHA256SUMS)
          bash scripts/release-qa.sh --notarized

      - name: Upload notarized release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          gh release upload "$tag" \
            "dist/Agent-Observatory-${VERSION}-macOS.dmg" \
            "dist/Agent-Observatory-${VERSION}-macOS.zip" \
            "dist/agents" \
            "dist/SHA256SUMS" \
            --clobber
