name: Observatory
options:
  bundleIdPrefix: com.github.cipher982.agentobservatory
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
    ENABLE_HARDENED_RUNTIME: YES
    # Notarization requires a secure timestamp and forbids the debug-only
    # get-task-allow entitlement. xcodebuild's non-archive default omits the
    # timestamp and injects get-task-allow, so force both here for every target.
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    # Sandbox OFF for v1: the app spawns a helper process and talks to localhost.
    # Tighten later with a proper XPC/helper entitlement if App Store distribution
    # is ever wanted.
    ENABLE_APP_SANDBOX: NO

targets:
  Observatory:
    type: application
    platform: macOS
    sources:
      - path: Observatory
    entitlements:
      path: Observatory/Observatory.entitlements
      properties:
        com.apple.developer.system-extension.install: true
        com.apple.developer.networking.networkextension:
          - app-proxy-provider-systemextension
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.github.cipher982.agentobservatory.Observatory
    info:
      path: Observatory/Info.plist
      properties:
        CFBundleDisplayName: Agent Observatory
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Agent Observatory"
        # Allow plaintext loopback HTTP to the local engine.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: "Agent Observatory"
        GENERATE_INFOPLIST_FILE: YES
        # NetworkExtension is a restricted entitlement → manual signing with a
        # Developer ID profile. IDs/profiles registered + installed 2026-05-31.
        DEVELOPMENT_TEAM: M49WM6JSW8
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        PROVISIONING_PROFILE_SPECIFIER: "Agent Observatory App DevID"
    dependencies:
      - target: TransparentProxyExtension
        embed: true
    preBuildScripts:
      - name: Build & embed Go engine
        basedOnDependencyAnalysis: false
        script: |
          set -e
          BACKEND="$SRCROOT/../backend"
          RES="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$RES"
          cd "$BACKEND"
          # Build a universal-ish arm64 helper for the bundle.
          /usr/local/go/bin/go build -o "$RES/agents" ./cmd/agents 2>/dev/null \
            || go build -o "$RES/agents" ./cmd/agents
          # go build emits an ad-hoc, linker-signed Mach-O with identifier "a.out".
          # The NE extension bypasses the proxy's own upstream flows by matching
          # this STABLE signing identifier (avoids the re-interception loop), so we
          # MUST sign with an explicit --identifier in every config. Release also
          # needs Developer ID + hardened runtime + timestamp for notarization;
          # Debug can ad-hoc sign (--sign -) but keeps the same identifier.
          HELPER_ID="com.github.cipher982.agentobservatory.agents"
          if [ "$CONFIGURATION" = "Release" ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            codesign --force --options runtime --timestamp \
              --identifier "$HELPER_ID" \
              --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$RES/agents"
            echo "signed embedded engine ($HELPER_ID) with $EXPANDED_CODE_SIGN_IDENTITY_NAME"
          else
            codesign --force --identifier "$HELPER_ID" --sign - "$RES/agents"
            echo "ad-hoc signed embedded engine ($HELPER_ID) for $CONFIGURATION"
          fi
          echo "embedded engine at $RES/agents"

  TransparentProxyExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: TransparentProxyExtension
    entitlements:
      path: TransparentProxyExtension/TransparentProxyExtension.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - app-proxy-provider-systemextension
        # NetworkExtension system-extension templates put NEMachServiceName in an
        # application-group namespace; the Developer ID profile grants M49WM6JSW8.*.
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.github.cipher982.agentobservatory.Observatory
    info:
      path: TransparentProxyExtension/Info.plist
      properties:
        CFBundleDisplayName: Agent Observatory Proxy
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        # System extensions declare their provider via NetworkExtension/
        # NEProviderClasses ONLY. The app-extension-style NSExtension dict makes
        # Xcode misclassify this as a Foundation app extension and warn that it
        # belongs in Contents/PlugIns — it does not; a NESystemExtension lives in
        # Contents/Library/SystemExtensions. Omitting NSExtension silences that.
        NetworkExtension:
          NEProviderClasses:
            com.apple.networkextension.app-proxy: $(PRODUCT_MODULE_NAME).TransparentProxyProvider
          NEMachServiceName: $(TeamIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
        NSSystemExtensionUsageDescription: Agent Observatory uses this system extension to capture local agent HTTPS traffic for inspection.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.cipher982.agentobservatory.Observatory.TransparentProxyExtension
        # SystemExtensions.framework matches the nested wrapper by identifier.
        # Keep the Swift module/executable short, but name the .systemextension
        # product after the bundle id so activation can find it in /Applications.
        PRODUCT_NAME: com.github.cipher982.agentobservatory.Observatory.TransparentProxyExtension
        EXECUTABLE_NAME: TransparentProxyExtension
        PRODUCT_MODULE_NAME: TransparentProxyExtension
        DEVELOPMENT_TEAM: M49WM6JSW8
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        PROVISIONING_PROFILE_SPECIFIER: "Agent Observatory Ext DevID"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"

  ObservatoryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ObservatoryTests
      # Compile the pure-logic sources directly into the test bundle. They have no
      # NetworkExtension dependency, and a system-extension executable target can't
      # be linked/@testable-imported, so we build them here rather than import.
      - path: TransparentProxyExtension/SNI.swift
      - path: TransparentProxyExtension/Allowlist.swift
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
