name: Observatory
options:
  bundleIdPrefix: com.github.cipher982.agentobservatory
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    # Sandbox OFF for v1: the app spawns a helper process and talks to localhost.
    # Tighten later with a proper XPC/helper entitlement if App Store distribution
    # is ever wanted.
    ENABLE_APP_SANDBOX: NO

targets:
  Observatory:
    type: application
    platform: macOS
    sources:
      - path: Observatory
    entitlements:
      path: Observatory/Observatory.entitlements
      properties:
        com.apple.developer.system-extension.install: true
        com.apple.developer.networking.networkextension:
          - app-proxy-provider-systemextension
        com.apple.security.application-groups:
          - group.com.github.cipher982.agentobservatory
    info:
      path: Observatory/Info.plist
      properties:
        CFBundleDisplayName: Agent Observatory
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Agent Observatory"
        # Allow plaintext loopback HTTP to the local engine.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: "Agent Observatory"
        GENERATE_INFOPLIST_FILE: YES
        # NetworkExtension is a restricted entitlement → manual signing with a
        # Developer ID profile. IDs/profiles registered + installed 2026-05-31.
        DEVELOPMENT_TEAM: M49WM6JSW8
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        PROVISIONING_PROFILE_SPECIFIER: "Agent Observatory App DevID"
    dependencies:
      - target: TransparentProxyExtension
        embed: true
    preBuildScripts:
      - name: Build & embed Go engine
        basedOnDependencyAnalysis: false
        script: |
          set -e
          BACKEND="$SRCROOT/../backend"
          RES="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$RES"
          cd "$BACKEND"
          # Build a universal-ish arm64 helper for the bundle.
          /usr/local/go/bin/go build -o "$RES/agents" ./cmd/agents 2>/dev/null \
            || go build -o "$RES/agents" ./cmd/agents
          echo "embedded engine at $RES/agents"

  TransparentProxyExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: TransparentProxyExtension
    entitlements:
      path: TransparentProxyExtension/TransparentProxyExtension.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - app-proxy-provider-systemextension
        com.apple.security.application-groups:
          - group.com.github.cipher982.agentobservatory
    info:
      path: TransparentProxyExtension/Info.plist
      properties:
        CFBundleDisplayName: Agent Observatory Proxy
        LSMinimumSystemVersion: "26.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.app-proxy
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).TransparentProxyProvider
        NetworkExtension:
          NEProviderClasses:
            com.apple.networkextension.app-proxy: $(PRODUCT_MODULE_NAME).TransparentProxyProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.cipher982.agentobservatory.Observatory.TransparentProxyExtension
        DEVELOPMENT_TEAM: M49WM6JSW8
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        PROVISIONING_PROFILE_SPECIFIER: "Agent Observatory Ext DevID"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"

  ObservatoryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ObservatoryTests
      # Compile the pure-logic sources directly into the test bundle. They have no
      # NetworkExtension dependency, and a system-extension executable target can't
      # be linked/@testable-imported, so we build them here rather than import.
      - path: TransparentProxyExtension/SNI.swift
      - path: TransparentProxyExtension/Allowlist.swift
    settings:
      base:
        SWIFT_VERSION: "5.0"
